<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Fitness Tracker"
    >

    <title>Fitness Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 16px;
            background: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        .app {
            width: 100%;
            max-width: 500px;
            min-height: calc(100vh - 32px);
            margin: 0 auto;
            padding: 20px;
            background: white;
        }

        h1 {
            margin-top: 0;
        }

        #setupScreen h1 {
            text-align: center;
        }

        #workoutTitle {
            margin-bottom: 32px;
            text-align: left;
            font-size: 24px;
        }

        label {
            display: block;
            margin-top: 16px;
            font-weight: bold;
        }

        .weight-input {
            width: 100%;
            margin-top: 6px;
            padding: 12px;
            border: 1px solid #aaa;
            border-radius: 4px;
            font-size: 18px;
        }

        .primary-button {
            width: 100%;
            min-height: 52px;
            margin-top: 24px;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: #222;
            color: white;
            font-size: 18px;
            cursor: pointer;
            touch-action: manipulation;
        }

        .secondary-button {
            width: 100%;
            min-height: 44px;
            margin-top: 48px;
            padding: 10px;
            border: 1px solid #bbb;
            border-radius: 6px;
            background: white;
            color: #777;
            font-size: 14px;
            cursor: pointer;
            touch-action: manipulation;
        }

        .exercise-card {
            margin-bottom: 32px;
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 7px;
        }

        .exercise-name {
            font-size: 18px;
        }

        .exercise-weight-button {
            min-height: 44px;
            padding: 6px 8px;
            border: none;
            background: transparent;
            color: inherit;
            font-size: 18px;
            text-decoration: underline;
            cursor: pointer;
            touch-action: manipulation;
            white-space: nowrap;
        }

        .set-list {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        .rep-button {
            width: 100%;
            min-height: 50px;
            margin: 0;
            padding: 6px 2px;
            border: 3px solid black;
            border-radius: 0;
            background: red;
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
        }

        .rep-button.completed {
            background: green;
            color: white;
        }

        .rep-button.failed {
            background: orange;
            color: black;
        }

        .instructions {
            margin-top: 24px;
            color: #555;
            font-size: 14px;
            line-height: 1.5;
        }

        #completionScreen {
            text-align: center;
        }

        #completionScreen h1 {
            margin-bottom: 12px;
        }

        #completionSummary {
            margin-top: 28px;
            text-align: left;
        }

        .summary-line {
            margin-bottom: 12px;
            padding: 12px;
            background: #f2f2f2;
            border-radius: 6px;
            line-height: 1.4;
        }

        @media (max-width: 380px) {
            body {
                padding: 0;
            }

            .app {
                min-height: 100vh;
                padding: 16px;
            }

            .set-list {
                gap: 5px;
            }

            .rep-button {
                min-height: 48px;
            }
        }
    </style>
</head>

<body>
    <div class="app">

        <!-- STARTING WEIGHT SCREEN -->
        <div id="setupScreen">
            <h1>Fitness Tracker</h1>
            <h2>Enter Starting Weights</h2>

            <label for="squat">Squat</label>
            <input
                id="squat"
                class="weight-input"
                type="number"
                min="5"
                step="5"
                inputmode="decimal"
                placeholder="Weight in pounds"
            >

            <label for="overheadPress">Overhead Press</label>
            <input
                id="overheadPress"
                class="weight-input"
                type="number"
                min="5"
                step="5"
                inputmode="decimal"
                placeholder="Weight in pounds"
            >

            <label for="barbellRow">Barbell Row</label>
            <input
                id="barbellRow"
                class="weight-input"
                type="number"
                min="5"
                step="5"
                inputmode="decimal"
                placeholder="Weight in pounds"
            >

            <label for="benchPress">Bench Press</label>
            <input
                id="benchPress"
                class="weight-input"
                type="number"
                min="5"
                step="5"
                inputmode="decimal"
                placeholder="Weight in pounds"
            >

            <label for="deadlift">Deadlift</label>
            <input
                id="deadlift"
                class="weight-input"
                type="number"
                min="5"
                step="5"
                inputmode="decimal"
                placeholder="Weight in pounds"
            >

            <button
                id="saveWeights"
                class="primary-button"
                type="button"
            >
                Save Starting Weights
            </button>
        </div>

        <!-- WORKOUT SCREEN -->
        <div id="workoutScreen" style="display: none;">
            <h1 id="workoutTitle"></h1>

            <div id="exerciseList"></div>

            <button
                id="finishWorkout"
                class="primary-button"
                type="button"
            >
                Finish Workout
            </button>

            <div class="instructions">
                Tap a red set button once to mark the full set complete.
                Tap it again to reduce the reps by one.
                Tap the underlined weight to permanently change it.
            </div>
        </div>

        <!-- COMPLETION SCREEN -->
        <div id="completionScreen" style="display: none;">
            <h1>Workout Logged</h1>

            <p id="nextWorkoutMessage"></p>

            <div id="completionSummary"></div>

            <button
                id="advanceWorkout"
                class="primary-button"
                type="button"
            >
                Start Next Workout
            </button>

            <button
                id="resetApp"
                class="secondary-button"
                type="button"
            >
                Settings
            </button>
        </div>

    </div>

    <script>
        const exerciseNames = {
            squat: "Squat",
            overheadPress: "Overhead Press",
            barbellRow: "Barbell Row",
            benchPress: "Bench Press",
            deadlift: "Deadlift"
        };

        const workouts = {
            A: [
                {
                    exercise: "squat",
                    sets: 5,
                    reps: 5
                },
                {
                    exercise: "overheadPress",
                    sets: 5,
                    reps: 5
                },
                {
                    exercise: "barbellRow",
                    sets: 5,
                    reps: 5
                }
            ],

            B: [
                {
                    exercise: "squat",
                    sets: 5,
                    reps: 5
                },
                {
                    exercise: "benchPress",
                    sets: 5,
                    reps: 5
                },
                {
                    exercise: "deadlift",
                    sets: 5,
                    reps: 1
                }
            ]
        };

        const setupScreen =
            document.getElementById("setupScreen");

        const workoutScreen =
            document.getElementById("workoutScreen");

        const completionScreen =
            document.getElementById("completionScreen");

        const workoutTitle =
            document.getElementById("workoutTitle");

        const exerciseList =
            document.getElementById("exerciseList");

        const completionSummary =
            document.getElementById("completionSummary");

        const nextWorkoutMessage =
            document.getElementById("nextWorkoutMessage");

        const advanceWorkoutButton =
            document.getElementById("advanceWorkout");

        document
            .getElementById("saveWeights")
            .addEventListener(
                "click",
                saveStartingWeights
            );

        document
            .getElementById("finishWorkout")
            .addEventListener(
                "click",
                finishWorkout
            );

        document
            .getElementById("advanceWorkout")
            .addEventListener(
                "click",
                advanceToNextWorkout
            );

        document
            .getElementById("resetApp")
            .addEventListener(
                "click",
                resetApp
            );

        function saveStartingWeights() {
            const weights = {
                squat: Number(
                    document.getElementById("squat").value
                ),

                overheadPress: Number(
                    document.getElementById("overheadPress").value
                ),

                barbellRow: Number(
                    document.getElementById("barbellRow").value
                ),

                benchPress: Number(
                    document.getElementById("benchPress").value
                ),

                deadlift: Number(
                    document.getElementById("deadlift").value
                )
            };

            const allWeightsEntered =
                Object.values(weights).every(
                    function (weight) {
                        return (
                            Number.isFinite(weight) &&
                            weight > 0 &&
                            weight % 5 === 0
                        );
                    }
                );

            if (!allWeightsEntered) {
                alert(
                    "Enter a starting weight for every exercise. Each weight must be an increment of 5 pounds."
                );

                return;
            }

            const confirmed = confirm(
                "Save these starting weights?\n\n" +
                "Squat: " +
                weights.squat +
                " lbs\n" +
                "Overhead Press: " +
                weights.overheadPress +
                " lbs\n" +
                "Barbell Row: " +
                weights.barbellRow +
                " lbs\n" +
                "Bench Press: " +
                weights.benchPress +
                " lbs\n" +
                "Deadlift: " +
                weights.deadlift +
                " lbs"
            );

            if (!confirmed) {
                return;
            }

            localStorage.setItem(
                "fitnessTrackerWeights",
                JSON.stringify(weights)
            );

            localStorage.setItem(
                "fitnessTrackerFailureCounts",
                JSON.stringify({
                    squat: 0,
                    overheadPress: 0,
                    barbellRow: 0,
                    benchPress: 0,
                    deadlift: 0
                })
            );

            localStorage.setItem(
                "nextWorkout",
                "A"
            );

            localStorage.removeItem(
                "lastWorkoutDate"
            );

            localStorage.removeItem(
                "lastWorkoutSummary"
            );

            localStorage.removeItem(
                "activeWorkout"
            );

            showApp();
        }

        function showApp() {
            const savedWeights =
                localStorage.getItem(
                    "fitnessTrackerWeights"
                );

            if (!savedWeights) {
                showSetupScreen();
                return;
            }

            const lastWorkoutDate =
                localStorage.getItem(
                    "lastWorkoutDate"
                );

            /*
                If a workout was completed today,
                remain on the completion screen.
            */
            if (lastWorkoutDate === getToday()) {
                showCompletionScreen();
                return;
            }

            /*
                If the previous workout was completed
                on an earlier date, automatically open
                the next scheduled workout.
            */
            showWorkout();
        }

        function showSetupScreen() {
            setupScreen.style.display =
                "block";

            workoutScreen.style.display =
                "none";

            completionScreen.style.display =
                "none";
        }

        function showWorkout() {
            const savedWeights =
                JSON.parse(
                    localStorage.getItem(
                        "fitnessTrackerWeights"
                    )
                );

            const workoutDay =
                localStorage.getItem(
                    "nextWorkout"
                ) || "A";

            const activeWorkout =
                loadActiveWorkout(
                    workoutDay
                );

            setupScreen.style.display =
                "none";

            workoutScreen.style.display =
                "block";

            completionScreen.style.display =
                "none";

            workoutTitle.textContent =
                workoutDay + " Day";

            exerciseList.innerHTML = "";

            workouts[workoutDay].forEach(
                function (item) {
                    const exerciseCard =
                        document.createElement(
                            "div"
                        );

                    exerciseCard.className =
                        "exercise-card";

                    exerciseCard.innerHTML = `
                        <div class="exercise-header">
                            <span class="exercise-name">
                                ${exerciseNames[item.exercise]}
                            </span>

                            <button
                                type="button"
                                class="exercise-weight-button"
                            >
                                ${savedWeights[item.exercise]} lbs
                            </button>
                        </div>

                        <div class="set-list"></div>
                    `;

                    const setList =
                        exerciseCard.querySelector(
                            ".set-list"
                        );

                    const weightButton =
                        exerciseCard.querySelector(
                            ".exercise-weight-button"
                        );

                    weightButton.addEventListener(
                        "click",
                        function () {
                            changeExerciseWeight(
                                item.exercise,
                                weightButton
                            );
                        }
                    );

                    for (
                        let setIndex = 0;
                        setIndex < item.sets;
                        setIndex++
                    ) {
                        const savedSet =
                            activeWorkout.exercises[
                                item.exercise
                            ][setIndex];

                        const repButton =
                            createRepButton(
                                item.exercise,
                                setIndex,
                                item.reps,
                                savedSet
                            );

                        setList.appendChild(
                            repButton
                        );
                    }

                    exerciseList.appendChild(
                        exerciseCard
                    );
                }
            );
        }

        function loadActiveWorkout(workoutDay) {
            const savedText =
                localStorage.getItem(
                    "activeWorkout"
                );

            if (savedText) {
                const savedWorkout =
                    JSON.parse(savedText);

                /*
                    Preserve an unfinished workout,
                    even if it was started on an earlier day.
                */
                if (
                    savedWorkout.day ===
                    workoutDay
                ) {
                    savedWorkout.date =
                        getToday();

                    localStorage.setItem(
                        "activeWorkout",
                        JSON.stringify(
                            savedWorkout
                        )
                    );

                    return savedWorkout;
                }
            }

            const newWorkout = {
                day: workoutDay,
                date: getToday(),
                exercises: {}
            };

            workouts[workoutDay].forEach(
                function (item) {
                    newWorkout.exercises[
                        item.exercise
                    ] = [];

                    for (
                        let setIndex = 0;
                        setIndex < item.sets;
                        setIndex++
                    ) {
                        newWorkout.exercises[
                            item.exercise
                        ].push({
                            status: "ready",
                            currentReps:
                                item.reps
                        });
                    }
                }
            );

            localStorage.setItem(
                "activeWorkout",
                JSON.stringify(
                    newWorkout
                )
            );

            return newWorkout;
        }

        function createRepButton(
            exercise,
            setIndex,
            maximumReps,
            savedSet
        ) {
            const repButton =
                document.createElement(
                    "button"
                );

            repButton.type =
                "button";

            repButton.className =
                "rep-button";

            repButton.dataset.exercise =
                exercise;

            repButton.dataset.setIndex =
                setIndex;

            repButton.dataset.maximumReps =
                maximumReps;

            repButton.dataset.currentReps =
                savedSet.currentReps;

            repButton.dataset.status =
                savedSet.status;

            updateButtonAppearance(
                repButton
            );

            repButton.addEventListener(
                "click",
                function () {
                    cycleRepButton(
                        repButton
                    );
                }
            );

            return repButton;
        }

        function cycleRepButton(repButton) {
            const maximumReps =
                Number(
                    repButton.dataset
                        .maximumReps
                );

            let currentReps =
                Number(
                    repButton.dataset
                        .currentReps
                );

            const status =
                repButton.dataset.status;

            /*
                Red button:
                first tap marks the full set complete.
            */
            if (status === "ready") {
                currentReps =
                    maximumReps;

                repButton.dataset.status =
                    "completed";
            }

            /*
                Green button:
                next tap removes one rep.
            */
            else if (
                status === "completed"
            ) {
                currentReps =
                    maximumReps - 1;

                repButton.dataset.status =
                    "failed";
            }

            /*
                Orange button:
                each tap removes another rep.
            */
            else if (
                currentReps > 0
            ) {
                currentReps--;
            }

            /*
                After zero:
                reset to the original red button.
            */
            else {
                currentReps =
                    maximumReps;

                repButton.dataset.status =
                    "ready";
            }

            repButton.dataset.currentReps =
                currentReps;

            updateButtonAppearance(
                repButton
            );

            saveButtonState(
                repButton
            );
        }

        function updateButtonAppearance(repButton) {
            const status =
                repButton.dataset.status;

            repButton.classList.remove(
                "completed",
                "failed"
            );

            if (
                status === "completed"
            ) {
                repButton.classList.add(
                    "completed"
                );
            }

            if (
                status === "failed"
            ) {
                repButton.classList.add(
                    "failed"
                );
            }

            repButton.textContent =
                repButton.dataset.currentReps;
        }

        function saveButtonState(repButton) {
            const activeWorkout =
                JSON.parse(
                    localStorage.getItem(
                        "activeWorkout"
                    )
                );

            const exercise =
                repButton.dataset.exercise;

            const setIndex =
                Number(
                    repButton.dataset
                        .setIndex
                );

            activeWorkout.exercises[
                exercise
            ][setIndex] = {
                status:
                    repButton.dataset.status,

                currentReps:
                    Number(
                        repButton.dataset
                            .currentReps
                    )
            };

            localStorage.setItem(
                "activeWorkout",
                JSON.stringify(
                    activeWorkout
                )
            );
        }

        function changeExerciseWeight(
            exercise,
            weightButton
        ) {
            const weights =
                JSON.parse(
                    localStorage.getItem(
                        "fitnessTrackerWeights"
                    )
                );

            const currentWeight =
                weights[exercise];

            const enteredWeight =
                prompt(
                    "Enter the new weight for " +
                    exerciseNames[exercise] +
                    ".\n\nCurrent weight: " +
                    currentWeight +
                    " lbs",
                    currentWeight
                );

            if (
                enteredWeight === null
            ) {
                return;
            }

            const newWeight =
                Number(
                    enteredWeight.trim()
                );

            if (
                !Number.isFinite(
                    newWeight
                ) ||
                newWeight <= 0
            ) {
                alert(
                    "Enter a valid weight greater than zero."
                );

                return;
            }

            if (
                newWeight % 5 !== 0
            ) {
                alert(
                    "The weight must be an increment of 5 pounds."
                );

                return;
            }

            if (
                newWeight ===
                currentWeight
            ) {
                return;
            }

            const confirmed =
                confirm(
                    "Permanently change " +
                    exerciseNames[exercise] +
                    " from " +
                    currentWeight +
                    " lbs to " +
                    newWeight +
                    " lbs?\n\n" +
                    "This new weight applies to today's workout and will be used for future progression."
                );

            if (!confirmed) {
                return;
            }

            weights[exercise] =
                newWeight;

            localStorage.setItem(
                "fitnessTrackerWeights",
                JSON.stringify(weights)
            );

            weightButton.textContent =
                newWeight + " lbs";

            alert(
                exerciseNames[exercise] +
                " was permanently changed to " +
                newWeight +
                " lbs."
            );
        }

        function finishWorkout() {
            const workoutDay =
                localStorage.getItem(
                    "nextWorkout"
                ) || "A";

            const activeWorkoutText =
                localStorage.getItem(
                    "activeWorkout"
                );

            if (!activeWorkoutText) {
                return;
            }

            const activeWorkout =
                JSON.parse(
                    activeWorkoutText
                );

            const everySetRecorded =
                workouts[workoutDay].every(
                    function (item) {
                        return activeWorkout
                            .exercises[
                                item.exercise
                            ]
                            .every(
                                function (set) {
                                    return (
                                        set.status !==
                                        "ready"
                                    );
                                }
                            );
                    }
                );

            if (!everySetRecorded) {
                alert(
                    "Record every set before finishing the workout."
                );

                return;
            }

            const finishConfirmed =
                confirm(
                    "Finish and permanently save this workout?"
                );

            if (!finishConfirmed) {
                return;
            }

            const weights =
                JSON.parse(
                    localStorage.getItem(
                        "fitnessTrackerWeights"
                    )
                );

            const failureCounts =
                getFailureCounts();

            const summaryLines = [];

            workouts[workoutDay].forEach(
                function (item) {
                    const exercise =
                        item.exercise;

                    const sets =
                        activeWorkout.exercises[
                            exercise
                        ];

                    const exerciseCompleted =
                        sets.every(
                            function (set) {
                                return (
                                    set.status ===
                                    "completed"
                                );
                            }
                        );

                    /*
                        All required reps completed:
                        increase next weight by 5 pounds.
                    */
                    if (
                        exerciseCompleted
                    ) {
                        weights[exercise] += 5;

                        failureCounts[
                            exercise
                        ] = 0;

                        summaryLines.push(
                            exerciseNames[
                                exercise
                            ] +
                            ": completed. Next weight is " +
                            weights[exercise] +
                            " lbs."
                        );

                        return;
                    }

                    /*
                        At least one set was missed:
                        add one consecutive failure.
                    */
                    failureCounts[
                        exercise
                    ]++;

                    /*
                        Two consecutive failures:
                        reduce by 10 percent and round
                        to the nearest 5 pounds.
                    */
                    if (
                        failureCounts[
                            exercise
                        ] >= 2
                    ) {
                        weights[exercise] =
                            roundToNearestFive(
                                weights[
                                    exercise
                                ] * 0.90
                            );

                        failureCounts[
                            exercise
                        ] = 0;

                        summaryLines.push(
                            exerciseNames[
                                exercise
                            ] +
                            ": missed twice. Next weight is reduced to " +
                            weights[exercise] +
                            " lbs."
                        );

                        return;
                    }

                    summaryLines.push(
                        exerciseNames[
                            exercise
                        ] +
                        ": not completed. Next weight stays at " +
                        weights[exercise] +
                        " lbs."
                    );
                }
            );

            const nextWorkout =
                workoutDay === "A"
                    ? "B"
                    : "A";

            localStorage.setItem(
                "fitnessTrackerWeights",
                JSON.stringify(weights)
            );

            localStorage.setItem(
                "fitnessTrackerFailureCounts",
                JSON.stringify(
                    failureCounts
                )
            );

            /*
                The workout alternates only after
                the current workout is completed.
            */
            localStorage.setItem(
                "nextWorkout",
                nextWorkout
            );

            localStorage.setItem(
                "lastWorkoutDate",
                getToday()
            );

            localStorage.setItem(
                "lastWorkoutSummary",
                JSON.stringify({
                    completedDay:
                        workoutDay,

                    nextWorkout:
                        nextWorkout,

                    lines:
                        summaryLines
                })
            );

            localStorage.removeItem(
                "activeWorkout"
            );

            showCompletionScreen();
        }

        function advanceToNextWorkout() {
            const nextWorkout =
                localStorage.getItem(
                    "nextWorkout"
                ) || "A";

            const confirmed =
                confirm(
                    "Start " +
                    nextWorkout +
                    " Day now?"
                );

            if (!confirmed) {
                return;
            }

            /*
                Removing this date allows the next
                workout to open immediately.
            */
            localStorage.removeItem(
                "lastWorkoutDate"
            );

            localStorage.removeItem(
                "lastWorkoutSummary"
            );

            localStorage.removeItem(
                "activeWorkout"
            );

            showWorkout();
        }

        function getFailureCounts() {
            const savedCounts =
                localStorage.getItem(
                    "fitnessTrackerFailureCounts"
                );

            const defaultCounts = {
                squat: 0,
                overheadPress: 0,
                barbellRow: 0,
                benchPress: 0,
                deadlift: 0
            };

            if (!savedCounts) {
                return defaultCounts;
            }

            return {
                ...defaultCounts,
                ...JSON.parse(savedCounts)
            };
        }

        function showCompletionScreen() {
            setupScreen.style.display =
                "none";

            workoutScreen.style.display =
                "none";

            completionScreen.style.display =
                "block";

            completionSummary.innerHTML =
                "";

            const savedSummary =
                localStorage.getItem(
                    "lastWorkoutSummary"
                );

            const nextWorkout =
                localStorage.getItem(
                    "nextWorkout"
                ) || "A";

            advanceWorkoutButton.textContent =
                "Start " +
                nextWorkout +
                " Day";

            if (!savedSummary) {
                nextWorkoutMessage.textContent =
                    nextWorkout +
                    " Day is next. Start it now or open the app on a later day.";

                return;
            }

            const summary =
                JSON.parse(
                    savedSummary
                );

            nextWorkoutMessage.textContent =
                summary.nextWorkout +
                " Day is next. Start it now or it will open automatically the next day.";

            summary.lines.forEach(
                function (line) {
                    const summaryLine =
                        document.createElement(
                            "div"
                        );

                    summaryLine.className =
                        "summary-line";

                    summaryLine.textContent =
                        line;

                    completionSummary.appendChild(
                        summaryLine
                    );
                }
            );
        }

        function roundToNearestFive(number) {
            return Math.max(
                5,
                Math.round(number / 5) * 5
            );
        }

        function getToday() {
            const today =
                new Date();

            const year =
                today.getFullYear();

            const month =
                String(
                    today.getMonth() + 1
                ).padStart(2, "0");

            const day =
                String(
                    today.getDate()
                ).padStart(2, "0");

            return (
                year +
                "-" +
                month +
                "-" +
                day
            );
        }

        function resetApp() {
            const openResetOptions =
                confirm(
                    "Open the reset options?\n\nNothing will be erased yet."
                );

            if (!openResetOptions) {
                return;
            }

            const resetText =
                prompt(
                    "This will permanently erase all weights and workout progress.\n\nType RESET to continue."
                );

            if (
                resetText !== "RESET"
            ) {
                alert(
                    "Nothing was erased."
                );

                return;
            }

            const finalConfirmation =
                confirm(
                    "Final warning:\n\nPermanently erase all weights and workout progress?"
                );

            if (!finalConfirmation) {
                alert(
                    "Nothing was erased."
                );

                return;
            }

            localStorage.clear();
            location.reload();
        }

        showApp();
    </script>
</body>
</html>
